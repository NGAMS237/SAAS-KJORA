name: SITE-APP-FLOW ephemeral SQL

on:
  workflow_dispatch:
  push:
    branches:
      - codex/site-app-flow-01
      - codex/security-tenants-access-01
      - claude/admin-01-secure-base
      - codex/kjora-first-paid-pilot-launch-readiness-14
      - codex/kjora-billing-market-transition-fix
      - codex/kjora-billing-market-ux-feedback

permissions:
  contents: read

jobs:
  isolated-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - name: Check out the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Run application validation
        run: |
          npm run typecheck
          npm run lint
          npm test
          npx next build --webpack
          git diff --check

      - name: Hold back the migrations under test
        run: |
          mv supabase/migrations/20260911210927_site_app_flow_canada_intent.sql "$RUNNER_TEMP/site-app-flow.sql"
          mv supabase/migrations/20261005205909_country_billing_whatsapp_flow_fix_07.sql "$RUNNER_TEMP/country-billing-whatsapp-flow-fix-07.sql"
          mv supabase/migrations/20261026120000_billing_market_active_commitment_guard.sql "$RUNNER_TEMP/billing-market-active-commitment-guard.sql"

      - name: Start a clean local Supabase stack
        run: npx --yes supabase@2.117.0 start

      - name: Create pre-migration fixtures
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f .github/ci/site-app-flow-pre-migration.sql

      - name: Apply the Canada intent migrations in chronological order
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/site-app-flow.sql"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/country-billing-whatsapp-flow-fix-07.sql"

      - name: Run Canada SQL and access-control tests
        run: |
          npx --yes supabase@2.117.0 test db supabase/tests/database/site_app_flow_canada_intent.test.sql
          npx --yes supabase@2.117.0 test db supabase/tests/database/country_billing_whatsapp_flow_fix_07.test.sql

      - name: Apply the active financial commitment market guard
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/billing-market-active-commitment-guard.sql"

      - name: Verify concurrent subscription preparation
        run: bash .github/ci/site-app-flow-concurrency.sh "$DATABASE_URL"

      - name: Remove pre-migration fixtures
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f .github/ci/site-app-flow-cleanup.sql

      - name: Run the existing database regression suite
        shell: bash
        run: |
          mapfile -t tests < <(find supabase/tests/database -name '*.test.sql' ! -name 'site_app_flow_canada_intent.test.sql' ! -name 'country_billing_whatsapp_flow_fix_07.test.sql' -print | sort)
          for test_file in "${tests[@]}"; do
            npx --yes supabase@2.117.0 test db "$test_file"
          done

      - name: Stop the isolated stack
        if: always()
        run: npx --yes supabase@2.117.0 stop --no-backup
