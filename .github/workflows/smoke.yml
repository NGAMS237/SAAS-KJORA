name: Smoke production

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: URL à tester
        default: https://kjorapp.com
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm run smoke -- "${{ inputs.base_url || 'https://kjorapp.com' }}"
